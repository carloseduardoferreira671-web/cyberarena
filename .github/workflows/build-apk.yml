name: Gerar APK

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK (plataforma 34 + build-tools 35.0.0)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0"

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/minha_chave.jks"
            echo "Usando a sua chave (secret KEYSTORE_BASE64)."
          else
            echo "Sem secret: será criada uma chave de teste nova (o APK não atualiza por cima de um APK assinado com outra chave)."
          fi

      - name: Build do APK
        env:
          KS: ${{ runner.temp }}/minha_chave.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'cyberarena-teste' }}
          SERVER_URL: ${{ vars.SERVER_URL }}   # Settings > Variables > Actions: endereço do servidor do site
        run: bash tools/android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CyberArena-apk
          path: CyberArena.apk
          retention-days: 30
