<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cyber Arena · Painel</title>
<style>
:root{--bg:#050913;--p:#0f1a38;--line:#2b4f8f;--cy:#1be5ff;--gold:#ffd23f;--grn:#3dffa0;--red:#ff3b5c;--tx:#eef7ff;--mut:#8fa6cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px}
h1{font-size:22px;margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
input{flex:1;min-width:140px;min-height:44px;padding:0 10px;background:#08101f;border:1px solid var(--line);color:var(--tx);font-size:15px}
button{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--p);color:var(--tx);font-weight:700;cursor:pointer}
button.p{background:var(--gold);color:#1a1000;border:0}button.r{border-color:var(--red);color:#ff9fb0}
.cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}.cnt div{background:var(--p);border:1px solid var(--line);padding:10px}.cnt b{display:block;font-size:26px;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid #16264a;text-align:left;vertical-align:top;word-break:break-all}th{color:var(--mut);font-weight:600}
.s-paid,.s-gift{color:var(--grn)}.s-pending{color:var(--gold)}.s-refunded,.s-failed,.s-expired{color:var(--mut)}.flag{color:var(--red);font-weight:700}
#msg{min-height:22px;margin:6px 0;color:var(--gold)}.wrap{overflow-x:auto}
</style></head><body>
<h1>Cyber Arena · Painel da pré-venda</h1>
<div class="row"><input id="key" type="password" placeholder="Chave de administrador (ADMIN_KEY)" autocomplete="off"><button class="p" id="go">ENTRAR</button></div>
<div id="msg"></div>
<div id="app" hidden>
  <div class="cnt" id="cnt"></div>
  <div class="row"><input id="gmail" placeholder="Presente: e-mail ou nome (testador, amigo...)"><button id="gift">GERAR CÓDIGO GRÁTIS</button><button id="csv">BAIXAR CSV</button><button id="rf">ATUALIZAR</button></div>
  <div class="row"><input id="find" placeholder="Filtrar por e-mail, código ou status"></div>
  <div class="wrap"><table><thead><tr><th>Quando</th><th>E-mail</th><th>Estado</th><th>Código</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script src="config.js"></script>
<script>
(()=>{
const API=((window.PRESALE||{}).api||'').replace(/\/$/,'')+'/api/presale/admin/',$=id=>document.getElementById(id);
let KEY=sessionStorage.getItem('adm')||'',ALL=[];
const say=t=>$('msg').textContent=t||'';
async function call(p,body){
  const r=await fetch(API+p,{method:body?'POST':'GET',headers:{'x-admin-key':KEY,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(p==='export'&&r.ok)return r.text();
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j;
}
const ST={paid:'PAGO',gift:'PRESENTE',pending:'AGUARDANDO',refunded:'DEVOLVIDO',failed:'FALHOU',expired:'EXPIROU'};
function draw(){
  const q=$('find').value.trim().toLowerCase(),tb=$('tb');tb.textContent='';
  ALL.filter(o=>!q||[o.email,o.code||'',o.status,ST[o.status]||''].join(' ').toLowerCase().includes(q)).slice(0,300).forEach(o=>{
    const tr=tb.insertRow();tr.insertCell().textContent=new Date(o.created).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    tr.insertCell().textContent=o.email;const c=tr.insertCell();c.textContent=(ST[o.status]||o.status)+(o.method?' · '+o.method:'');c.className='s-'+o.status;
    if(o.flag){const f=document.createElement('div');f.className='flag';f.textContent='⚠ '+o.flag;c.appendChild(f)}
    tr.insertCell().textContent=o.code||'';const a=tr.insertCell();
    if(o.status==='pending'||o.status==='expired'||o.status==='failed'){const b=document.createElement('button');b.textContent='Confirmar pago';b.onclick=()=>act('confirm',{id:o.id},'Confirmar manualmente que ESTE pedido foi pago? (confira no Mercado Pago)');a.appendChild(b)}
    if(o.status==='paid'){const b=document.createElement('button');b.className='r';b.textContent='Devolver';b.onclick=()=>act('refund',{id:o.id},'Devolver o dinheiro e cancelar o código?');a.appendChild(b)}
    if(o.code&&['paid','gift'].includes(o.status)&&o.status==='gift'){const b=document.createElement('button');b.className='r';b.textContent='Cancelar';b.onclick=()=>act('revoke',{code:o.code},'Cancelar este código?');a.appendChild(b)}
  });
}
async function load(){
  try{const j=await call('list');ALL=j.orders;const c=j.counts;
    $('cnt').innerHTML='';[['Pagos',c.paid],['Aguardando',c.pending],['Vagas livres',c.left],['Presentes',c.gift],['Devolvidos',c.refunded]].forEach(([l,n])=>{const d=document.createElement('div');d.textContent=l;const b=document.createElement('b');b.textContent=n;d.prepend(b);$('cnt').appendChild(d)});
    $('app').hidden=false;sessionStorage.setItem('adm',KEY);say('');draw()}
  catch(e){say(e.message);$('app').hidden=true}
}
async function act(p,body,q){if(q&&!confirm(q))return;try{const j=await call(p,body);say(j.code?'Código: '+j.code:'Feito.');load()}catch(e){say(e.message)}}
$('go').onclick=()=>{KEY=$('key').value.trim()||KEY;load()};
$('rf').onclick=load;$('find').oninput=draw;
$('gift').onclick=()=>act('gift',{email:$('gmail').value||'presente',note:'painel'});
$('csv').onclick=async()=>{try{const t=await call('export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='cyberarena-compradores.csv';a.click()}catch(e){say(e.message)}};
if(KEY)load();
})();
</script></body></html>
